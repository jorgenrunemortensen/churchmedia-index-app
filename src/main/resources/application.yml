spring:
  application:
    name: indexing-app

  # Secrets come from environment variables, or from a local, uncommitted .env file (see .env.example)
  config:
    import: optional:file:.env[.properties]

  groovy:
    template:
      enabled: false

  elasticsearch:
    uris: http://localhost:9200

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

  security:
    oauth2:
      client:
        registration:
          content-app:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: indexing-app
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/Alive/protocol/openid-connect/token

content-app:
  api:
    base-url: http://localhost:8081

logging:
  level:
    root: INFO
    dk.runerne: DEBUG

server:
  port: 8086

api:
  base-path: /api/v1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha