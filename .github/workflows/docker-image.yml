name: Docker image

# Builds the Docker image and publishes it to GitHub Container Registry (ghcr.io).
#  - push to master  -> tags 'latest' and 'sha-<commit>'
#  - tag 'v1.2.3'    -> tags '1.2.3' and '1.2'
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      # The private 'common' library is built from source as part of the image.
      # COMMON_DEPLOY_KEY is the private half of a read-only deploy key on the 'common' repository.
      - name: Checkout common
        uses: actions/checkout@v4
        with:
          repository: jorgenrunemortensen/common
          ssh-key: ${{ secrets.COMMON_DEPLOY_KEY }}
          path: common

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          build-contexts: common-src=common
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
